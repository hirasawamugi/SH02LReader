plugins { id 'com.android.application' }

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('tools/signing/release.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    namespace 'com.sh02l.reader'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.sh02l.reader'
        minSdk 27
        targetSdk 35
        versionCode 5
        versionName '0.3.0-m2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    signingConfigs {
        localRelease {
            if (releasePropertiesFile.exists()) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
        debug {
            storeFile rootProject.file('tools/signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.localRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}

dependencies { implementation project(':engine-txt') }

// AGP 8.6.1 assumes .git is a directory and misses linked worktrees/packed refs.
// Resolve with Git itself, and make a new checkout revision invalidate the build stamp.
def checkedOutRevision = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', '--verify', 'HEAD'
}.standardOutput.asText.map { it.trim() }
tasks.withType(com.android.build.gradle.internal.tasks.ExtractVersionControlInfoTask).configureEach {
    inputs.property('checkedOutRevision', checkedOutRevision)
    doLast {
        def revision = checkedOutRevision.get()
        if (!(revision ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid source revision')
        vcInfoFile.get().asFile.setText('repositories {\n  system: GIT\n  local_root_path: "$PROJECT_DIR"\n  revision: "' + revision + '"\n}\n', 'UTF-8')
    }
}
